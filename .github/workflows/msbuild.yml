name: Build and Release

on:
  # Build validation on push to master or on pull requests (no release)
  push:
    branches: [ "master" ]
    # Trigger build + release when a v*.*.* tag is pushed
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ "master" ]
  # Allow manual trigger for testing
  workflow_dispatch:

permissions:
  contents: write  # Required to create a Release

env:
  SOLUTION_FILE: MFCApplication17.sln
  BUILD_CONFIGURATION: Release

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [Win32, x64]
        include:
          - platform: Win32
            arch_name: x86
            output_dir: Release
          - platform: x64
            arch_name: x64
            output_dir: x64/Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build ${{ matrix.arch_name }} Release
        run: |
          msbuild ${{ env.SOLUTION_FILE }} `
            /p:Configuration=${{ env.BUILD_CONFIGURATION }} `
            /p:Platform=${{ matrix.platform }} `
            /m /v:minimal

      - name: Upload build artifacts (${{ matrix.arch_name }})
        uses: actions/upload-artifact@v4
        with:
          name: MathFunctionCreator-${{ matrix.arch_name }}
          path: |
            ${{ matrix.output_dir }}/*.exe
            ${{ matrix.output_dir }}/*.dll

  # Release step runs only when a v* tag is pushed
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package zip archives
        run: |
          cd artifacts
          # Ship src.txt from the source folder alongside the executables
          cp -f ../MFCApplication17/src.txt MathFunctionCreator-x86/
          cp -f ../MFCApplication17/src.txt MathFunctionCreator-x64/
          zip -r MathFunctionCreator-${{ github.ref_name }}-x86.zip MathFunctionCreator-x86/
          zip -r MathFunctionCreator-${{ github.ref_name }}-x64.zip MathFunctionCreator-x64/
          ls -la

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MathFunctionCreator ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*.zip
