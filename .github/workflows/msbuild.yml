name: Build and Release

on:
  # Build validation on push to master or on pull requests (no release)
  push:
    branches: [ "master" ]
    # Trigger build + release when a v*.*.* tag is pushed
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ "master" ]
  # Allow manual trigger for testing
  workflow_dispatch:

permissions:
  contents: write  # Required to create a Release

env:
  SOLUTION_FILE: MFCApplication17.sln
  BUILD_CONFIGURATION: Release
  # Solution-level platform name in MFCApplication17.sln is "x64"
  # (the legacy "Win32" alias is not defined in this solution, which caused MSB4126)
  SOLUTION_PLATFORM: x64
  OUTPUT_DIR: x64/Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build x64 Release
        run: |
          msbuild ${{ env.SOLUTION_FILE }} `
            /p:Configuration=${{ env.BUILD_CONFIGURATION }} `
            /p:Platform=${{ env.SOLUTION_PLATFORM }} `
            /m /v:minimal

      - name: Upload build artifacts (x64)
        uses: actions/upload-artifact@v4
        with:
          name: MathFunctionCreator-x64
          path: |
            ${{ env.OUTPUT_DIR }}/*.exe
            ${{ env.OUTPUT_DIR }}/*.dll

  # Release step runs only when a v* tag is pushed
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package zip archive
        run: |
          cd artifacts
          # Ship src.txt from the source folder alongside the executables
          cp -f ../MFCApplication17/src.txt MathFunctionCreator-x64/
          zip -r MathFunctionCreator-${{ github.ref_name }}-x64.zip MathFunctionCreator-x64/
          ls -la

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MathFunctionCreator ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*.zip
